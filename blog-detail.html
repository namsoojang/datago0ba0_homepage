<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이동 중입니다 | 데이터공방</title>

  <!--
    구버전 URL 호환용 리다이렉트 페이지입니다.

    블로그 글은 blog-detail.html?id=ref-NN 형태의 쿼리스트링 단일 페이지에서
    blog/ref-NN.html 정적 경로로 전환되었습니다. 검색엔진이 이 주소를
    "표준 URL 없는 중복 페이지"로 처리하던 문제를 해결하기 위해서입니다.

    이미 공유된 링크와 검색결과에 남아 있는 주소를 살리기 위해 이 페이지를 유지하되,
    새 주소로 즉시 이동시키고 색인 대상에서는 제외합니다.
  -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://datagongbang.kr/blog">

  <script>
    (function () {
      var id = new URLSearchParams(window.location.search).get('id');
      // ref-12 처럼 예상된 형태일 때만 이동시킵니다 (임의 값으로 인한 오작동 방지)
      var target = /^ref-\d+$/.test(id || '') ? '/blog/' + id : '/blog';
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p style="font-family:Pretendard,'Malgun Gothic',sans-serif;padding:40px;text-align:center;">
    새 주소로 이동 중입니다.
    자동으로 넘어가지 않으면 <a href="/blog">블로그 목록</a>을 눌러 주세요.
  </p>
</body>
</html>

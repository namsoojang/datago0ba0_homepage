<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이동 중입니다 | 데이터공방</title>

  <!--
    구버전 URL 호환용 리다이렉트 페이지입니다.

    도구 이름이 '이미지 컬러 팔레트 추출·추천'에서 '브랜드 컬러 PPT 템플릿 만들기'로
    바뀌면서 주소도 /color-palette 에서 /ppt-template 으로 옮겼습니다.
    GitHub Pages 는 301 리다이렉트를 설정할 수 없어, 이미 공유된 링크와
    검색결과에 남아 있는 주소를 살리기 위해 이 페이지를 유지합니다.
  -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://datagongbang.kr/ppt-template">
  <meta http-equiv="refresh" content="0; url=/ppt-template">
  <script>window.location.replace('/ppt-template');</script>
</head>
<body>
  <p style="font-family:Pretendard,'Malgun Gothic',sans-serif;padding:40px;text-align:center;">
    새 주소로 이동 중입니다.
    자동으로 넘어가지 않으면 <a href="/ppt-template">브랜드 컬러 PPT 템플릿 만들기</a>를 눌러 주세요.
  </p>
</body>
</html>

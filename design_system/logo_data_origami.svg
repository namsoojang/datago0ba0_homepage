<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <!-- Facets of the Origami Crane (종이학 형태를 형상화한 데이터 파셋 조각들) -->
  <!-- Left Wing Facet 1 (Darker Gold) -->
  <polygon points="50,45 20,40 40,65" fill="#9E7D55" opacity="0.9"/>
  <!-- Left Wing Facet 2 (Medium Gold) -->
  <polygon points="50,45 40,65 50,75" fill="#C5A880" opacity="0.9"/>
  
  <!-- Right Wing Facet 1 (Bright Gold) -->
  <polygon points="50,45 80,40 60,65" fill="#E5C158" opacity="0.95"/>
  <!-- Right Wing Facet 2 (Medium Gold) -->
  <polygon points="50,45 60,65 50,75" fill="#C5A880" opacity="0.95"/>
  
  <!-- Head & Neck Facet (Bright Accent Gold) -->
  <polygon points="50,45 50,20 44,28" fill="#E5C158" opacity="1"/>
  <polygon points="50,45 44,28 40,40" fill="#C5A880" opacity="0.9"/>
  
  <!-- Tail Facet (Dark Gold) -->
  <polygon points="50,45 50,75 58,85" fill="#9E7D55" opacity="0.8"/>
  <polygon points="50,45 58,85 60,65" fill="#C5A880" opacity="0.85"/>
  
  <!-- Center fold line highlighting -->
  <line x1="50" y1="20" x2="50" y2="75" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>

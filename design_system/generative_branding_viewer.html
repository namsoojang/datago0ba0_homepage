<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터공방 제너레이티브 브랜딩 뷰어 - Precision Atelier</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand UI Colors for Sidebar */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
            --brand-navy: #0b132b;
            --brand-gold: #E5C158;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 340px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 13px;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 24px;
        }

        .control-section h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--brand-gold);
            font-weight: bold;
            font-size: 18px;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 10px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            margin-bottom: 10px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--brand-gold);
            box-shadow: 0 0 0 2px rgba(229, 193, 88, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 16px;
        }

        .control-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 6px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--brand-gold);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #d6b24a;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: var(--anthropic-mid-gray);
            min-width: 50px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 12px;
        }

        .color-group label {
            display: block;
            font-size: 11px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--brand-gold);
            color: var(--brand-navy);
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #d6b24a;
            color: var(--brand-navy);
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-light-gray);
            color: var(--anthropic-dark);
        }

        .button.secondary:hover {
            background: var(--anthropic-mid-gray);
            color: white;
        }

        .button.tertiary {
            background: var(--brand-navy);
            color: white;
        }

        .button.tertiary:hover {
            background: #1d2d54;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.15);
            background: var(--brand-navy);
            position: relative;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: var(--brand-gold);
            font-family: 'Poppins', sans-serif;
            letter-spacing: 1px;
        }

        /* Responsive */
        @media (max-width: 800px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <h1>데이터공방 제너레이티브 브랜딩</h1>
            <div class="subtitle">"정밀 아틀리에" 디자인 철학에 따른 데이터 흐름과 입체 궤적 뷰어</div>

            <!-- Seed Navigation -->
            <div class="control-section">
                <h3>시드 제어 (Seeded Random)</h3>
                <input type="number" id="seed-input" class="seed-input" value="777" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← 이전</button>
                    <button class="button secondary" onclick="nextSeed()">다음 →</button>
                </div>
                <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ 랜덤 시드 생성</button>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>디자인 파라미터</h3>
                
                <!-- Node Count -->
                <div class="control-group">
                    <label>데이터 노드 수</label>
                    <div class="slider-container">
                        <input type="range" id="nodeCount" min="300" max="2000" step="50" value="800" oninput="updateParam('nodeCount', this.value)">
                        <span class="value-display" id="nodeCount-value">800</span>
                    </div>
                </div>

                <!-- Loop Curvature -->
                <div class="control-group">
                    <label>무한 궤도 곡률 (Curvature)</label>
                    <div class="slider-container">
                        <input type="range" id="curvature" min="0.1" max="3.0" step="0.1" value="1.2" oninput="updateParam('curvature', this.value)">
                        <span class="value-display" id="curvature-value">1.2</span>
                    </div>
                </div>

                <!-- Flow Speed -->
                <div class="control-group">
                    <label>데이터 흐름 속도</label>
                    <div class="slider-container">
                        <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0" oninput="updateParam('speed', this.value)">
                        <span class="value-display" id="speed-value">1.0</span>
                    </div>
                </div>

                <!-- Glow Intensity -->
                <div class="control-group">
                    <label>AI 네온 광원 세기</label>
                    <div class="slider-container">
                        <input type="range" id="glow" min="0.5" max="3.0" step="0.1" value="1.5" oninput="updateParam('glow', this.value)">
                        <span class="value-display" id="glow-value">1.5</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="control-section">
                <h3>브랜드 컬러</h3>
                
                <!-- Navy Color -->
                <div class="color-group">
                    <label>Deep Navy (배경)</label>
                    <div class="color-picker-container">
                        <input type="color" id="colorNavy" value="#0b132b" onchange="updateColor('colorNavy', this.value)">
                        <span class="color-value" id="colorNavy-value">#0b132b</span>
                    </div>
                </div>

                <!-- Gold Color -->
                <div class="color-group">
                    <label>Accent Gold (활성 노드)</label>
                    <div class="color-picker-container">
                        <input type="color" id="colorGold" value="#E5C158" onchange="updateColor('colorGold', this.value)">
                        <span class="color-value" id="colorGold-value">#E5C158</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="control-section">
                <h3>작업</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">초기화</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">정밀 아틀리에 알고리즘 초기화 중...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // PARAMETERS DEFINITION
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 777,
            nodeCount: 800,
            curvature: 1.2,
            speed: 1.0,
            glow: 1.5,
            colorNavy: '#0b132b',
            colorGold: '#E5C158'
        };

        let defaultParams = {...params};

        // ═══════════════════════════════════════════════════════════════════════
        // P5.JS GENERATIVE ART ALGORITHM
        // ═══════════════════════════════════════════════════════════════════════

        let particles = [];
        let gridNodes = [];
        let bgCanvas;

        function setup() {
            let container = document.getElementById('canvas-container');
            let size = min(container.offsetWidth, 800);
            let canvas = createCanvas(size, size);
            canvas.parent('canvas-container');
            
            initializeSystem();
            
            // Remove loading message
            let loadingEl = document.querySelector('.loading');
            if (loadingEl) loadingEl.style.display = 'none';
        }

        function windowResized() {
            let container = document.getElementById('canvas-container');
            let size = min(container.offsetWidth, 800);
            resizeCanvas(size, size);
            initializeSystem();
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            // Recreate Particles
            particles = [];
            for (let i = 0; i < params.nodeCount; i++) {
                particles.push(new DataParticle());
            }

            // Create Grid Nodes for structural matrix (Embodying Precision Atelier)
            gridNodes = [];
            let spacing = width / 20;
            for (let x = spacing/2; x < width; x += spacing) {
                for (let y = spacing/2; y < height; y += spacing) {
                    gridNodes.push({
                        origX: x,
                        origY: y,
                        x: x,
                        y: y,
                        size: random(1, 3)
                    });
                }
            }
        }

        function draw() {
            // Draw background with slight alpha for trailing glow effect
            background(red(color(params.colorNavy)), green(color(params.colorNavy)), blue(color(params.colorNavy)), 35);

            // Draw Background Structural Grid Matrix
            drawStructureMatrix();

            // Run & Draw Flowing Data Particles
            for (let p of particles) {
                p.update();
                p.display();
            }

            // Draw Central Monogram Geometry (ㄷ & ㄱ Concept Overlay)
            drawMonogramGeometry();

            // Draw interactive user visualizer
            drawInteractiveTouch();
        }

        // Draw systematic background matrix dots (Precision Atelier concept)
        function drawStructureMatrix() {
            stroke(red(color(params.colorGold)), green(color(params.colorGold)), blue(color(params.colorGold)), 25);
            strokeWeight(1);
            
            for (let node of gridNodes) {
                // Wave distortion based on noise + mouse position
                let d = dist(mouseX, mouseY, node.origX, node.origY);
                let force = 0;
                if (d < 150) {
                    force = map(d, 0, 150, 20, 0);
                }
                
                let angle = atan2(node.origY - mouseY, node.origX - mouseX);
                node.x = node.origX + cos(angle) * force + sin(frameCount * 0.02 + node.origX) * 2;
                node.y = node.origY + sin(angle) * force + cos(frameCount * 0.02 + node.origY) * 2;
                
                point(node.x, node.y);
            }
        }

        // Draws the conceptual, glowing "ㄷ" & "ㄱ" geometry in the center
        function drawMonogramGeometry() {
            push();
            translate(width / 2, height / 2);
            noFill();
            
            let pulse = sin(frameCount * 0.03) * 5;
            let goldCol = color(params.colorGold);

            // Outer "ㄷ" shape frame representing structured archive
            stroke(red(goldCol), green(goldCol), blue(goldCol), 150);
            strokeWeight(3 * params.glow);
            beginShape();
            vertex(70 + pulse, -80);
            vertex(-80, -80);
            vertex(-80, 80);
            vertex(70 + pulse, 80);
            endShape();

            // Inner "ㄱ" shape frame representing technological core
            stroke(red(goldCol), green(goldCol), blue(goldCol), 200 + pulse * 5);
            strokeWeight(5 * params.glow);
            beginShape();
            vertex(-20, -20);
            vertex(40, -20);
            vertex(40, 50 + pulse);
            endShape();

            // Intersecting nodes (sparkling logic cores)
            fill(255);
            noStroke();
            ellipse(-80, -80, 6 * params.glow);
            ellipse(-80, 80, 6 * params.glow);
            ellipse(40, -20, 8 * params.glow);
            ellipse(40, 50 + pulse, 6 * params.glow);
            
            pop();
        }

        function drawInteractiveTouch() {
            if (mouseIsPressed && mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height) {
                // Draw ripple circle representing active data refining/debugging
                noFill();
                stroke(255, 100);
                strokeWeight(1.5);
                let rippleSize = (frameCount * 4) % 120;
                ellipse(mouseX, mouseY, rippleSize);
                ellipse(mouseX, mouseY, rippleSize * 0.5);

                // Sparkling node core
                fill(red(color(params.colorGold)), green(color(params.colorGold)), blue(color(params.colorGold)));
                noStroke();
                ellipse(mouseX, mouseY, 8);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // DATA PARTICLE SYSTEM
        // ═══════════════════════════════════════════════════════════════════════

        class DataParticle {
            constructor() {
                this.reset();
            }

            reset() {
                // Initialize on a random path or circle
                this.angle = random(TWO_PI);
                this.radius = random(50, width * 0.6);
                
                // Position based on polar coordinates
                this.x = width / 2 + cos(this.angle) * this.radius;
                this.y = height / 2 + sin(this.angle) * this.radius;
                
                this.prevX = this.x;
                this.prevY = this.y;
                
                this.speed = random(1.5, 4.5) * params.speed;
                this.hueShift = random(0.7, 1.3);
                
                // Lifespan of data particle flow
                this.life = random(100, 250);
                this.maxLife = this.life;
            }

            update() {
                this.prevX = this.x;
                this.prevY = this.y;

                // Flow vector calculation (embracing the Infinite Loop Curvature)
                // We create a force field that mimics a combination of an infinity loop & vortex
                let centerX = width / 2;
                let centerY = height / 2;
                
                let dx = this.x - centerX;
                let dy = this.y - centerY;
                let r = sqrt(dx*dx + dy*dy);
                
                // Perlin Noise force injection
                let noiseAngle = noise(this.x * 0.003, this.y * 0.003, frameCount * 0.005) * TWO_PI * params.curvature;
                
                // Standard orbital force + loop force
                let orbitAngle = atan2(dy, dx) + HALF_PI;
                
                // Blended direction
                let finalAngle = lerp(orbitAngle, noiseAngle, 0.45);
                
                // Vector update
                this.x += cos(finalAngle) * this.speed;
                this.y += sin(finalAngle) * this.speed;

                // Slow inward pull
                this.x -= (dx / r) * 0.35;
                this.y -= (dy / r) * 0.35;

                // Decrease life
                this.life--;
                
                // Reset if dead or out of bounds
                if (this.life <= 0 || this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.reset();
                }
            }

            display() {
                // Glow alpha depends on current life ratio
                let alpha = map(this.life, 0, this.maxLife, 0, 180);
                let goldCol = color(params.colorGold);

                stroke(red(goldCol), green(goldCol), blue(goldCol), alpha);
                
                // Speed-based line thickness
                strokeWeight(random(1, 2.5) * params.glow);
                line(this.prevX, this.prevY, this.x, this.y);

                // Render tiny glowing header nodes at 5% rate
                if (random(1) < 0.05) {
                    fill(255, alpha + 50);
                    noStroke();
                    ellipse(this.x, this.y, random(2, 4.5));
                }
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(paramName, value) {
            params[paramName] = parseFloat(value);
            document.getElementById(paramName + '-value').textContent = value;
            
            if (paramName === 'nodeCount') {
                // Re-initialize system particles to match the slider
                initializeSystem();
            }
        }

        function updateColor(colorId, value) {
            params[colorId] = value;
            document.getElementById(colorId + '-value').textContent = value;
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED NAVIGATION FUNCTIONS
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 9999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams};
            
            // Update UI elements
            document.getElementById('nodeCount').value = params.nodeCount;
            document.getElementById('nodeCount-value').textContent = params.nodeCount;
            document.getElementById('curvature').value = params.curvature;
            document.getElementById('curvature-value').textContent = params.curvature;
            document.getElementById('speed').value = params.speed;
            document.getElementById('speed-value').textContent = params.speed;
            document.getElementById('glow').value = params.glow;
            document.getElementById('glow-value').textContent = params.glow;
            
            // Reset colors
            document.getElementById('colorNavy').value = params.colorNavy;
            document.getElementById('colorNavy-value').textContent = params.colorNavy;
            document.getElementById('colorGold').value = params.colorGold;
            document.getElementById('colorGold-value').textContent = params.colorGold;
            
            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <!-- Gradient definitions for luxury gold look -->
  <defs>
    <linearGradient id="goldGradient" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#9E7D55"/>
    </linearGradient>
  </defs>

  <!-- Monogram D Stroke (Left loop and stem) -->
  <path d="M 32,20 L 32,80 M 32,20 C 60,20 68,32 68,50 C 68,68 60,80 32,80" stroke="url(#goldGradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Monogram G Stroke (Inner/Right overlap loop) -->
  <path d="M 68,50 L 52,50 M 60,40 C 60,35 55,30 46,30 C 37,30 32,38 32,50 C 32,62 37,70 46,70 C 56,70 60,62 60,54" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Accent data dot -->
  <circle cx="68" cy="50" r="4.5" fill="#E5C158"/>
</svg>

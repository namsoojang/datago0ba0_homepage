<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <!-- Outer Hexagon Frame (데이터 공간 및 인프라 상징) -->
  <polygon points="50,8 88,30 88,74 50,96 12,74 12,30" stroke="#C5A880" stroke-width="4" stroke-linejoin="round" fill="rgba(15, 23, 42, 0.4)"/>
  
  <!-- Outer Connection Nodes (데이터 네트워크) -->
  <circle cx="50" cy="8" r="4.5" fill="#E5C158" stroke="#060B19" stroke-width="1.5"/>
  <circle cx="88" cy="30" r="4.5" fill="#E5C158" stroke="#060B19" stroke-width="1.5"/>
  <circle cx="88" cy="74" r="4.5" fill="#E5C158" stroke="#060B19" stroke-width="1.5"/>
  <circle cx="50" cy="96" r="4.5" fill="#E5C158" stroke="#060B19" stroke-width="1.5"/>
  <circle cx="12" cy="74" r="4.5" fill="#E5C158" stroke="#060B19" stroke-width="1.5"/>
  <circle cx="12" cy="30" r="4.5" fill="#E5C158" stroke="#060B19" stroke-width="1.5"/>

  <!-- Network Interconnections (데이터 허브 연결망) -->
  <line x1="50" y1="50" x2="50" y2="8" stroke="rgba(197, 168, 128, 0.4)" stroke-width="1.5"/>
  <line x1="50" y1="50" x2="88" y2="30" stroke="rgba(197, 168, 128, 0.4)" stroke-width="1.5"/>
  <line x1="50" y1="50" x2="88" y2="74" stroke="rgba(197, 168, 128, 0.4)" stroke-width="1.5"/>
  <line x1="50" y1="50" x2="50" y2="96" stroke="rgba(197, 168, 128, 0.4)" stroke-width="1.5"/>
  <line x1="50" y1="50" x2="12" y2="74" stroke="rgba(197, 168, 128, 0.4)" stroke-width="1.5"/>
  <line x1="50" y1="50" x2="12" y2="30" stroke="rgba(197, 168, 128, 0.4)" stroke-width="1.5"/>

  <!-- Center Cog/Gear (공방의 장인정신 및 기계학습/자동화 엔진 상징) -->
  <circle cx="50" cy="50" r="15" stroke="#C5A880" stroke-width="3" fill="#060B19"/>
  <!-- Cog teeth (톱니발) -->
  <path d="M50,30 L50,35 M50,65 L50,70 M30,50 L35,50 M65,50 L70,50 M36,36 L40,40 M64,64 L68,68 M36,64 L40,60 M64,36 L68,40" stroke="#C5A880" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Central Data Node Core -->
  <circle cx="50" cy="50" r="6" fill="#E5C158"/>
</svg>
